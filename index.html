<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>弘极七班管理系统</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei", sans-serif}
body{background:#f0f2f5}
#login{
    display:grid;
    place-items:center;
    height:100vh;
}
.login-box{
    background:#fff;
    width:400px;padding:40px;border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,0.1);
}
.login-title{
    font-size:28px;color:#165DFF;text-align:center;
    margin-bottom:10px;
}
.login-desc{
    text-align:center;color:#666;margin-bottom:30px;font-size:14px
}
.sync-status{
    text-align:center;padding:8px;border-radius:6px;margin-bottom:15px;font-size:13px;
}
.sync-on{background:#f0f9ff;color:#0e7490}
.sync-off{background:#f3f4f6;color:#6b7280}
.input-item{
    margin-bottom:20px
}
.input-item label{
    display:block;margin-bottom:8px;color:#333;font-size:14px
}
.input-item input{
    width:100%;padding:12px;border:1px solid #ddd;
    border-radius:6px;font-size:14px;
}
.login-btn{
    width:100%;padding:12px;
    background:#165DFF;color:#fff;
    border:none;border-radius:6px;font-size:16px;margin-top:10px;cursor:pointer;
}
.tips{display:none}
#system-select{
    display:none;
    justify-content:center;
    align-items:center;
    height:100vh;
}
#main{display:none}
.system-select-box{
    background:#fff;
    width:550px;padding:40px;border-radius:12px;
    box-shadow:0 2px 12px rgba(0,0,0,0.1);
    text-align:center;
}
.system-title{
    font-size:24px;color:#165DFF;margin-bottom:30px;
}
.system-card{
    display:inline-block;width:200px;padding:30px;margin:10px;
    border-radius:8px;cursor:pointer;
    border:1px solid #ddd;
    background:#fff;
    vertical-align:top;
}
.system-card:hover{
    border-color:#165DFF;background:#f8f9ff;
}
.system-card h3{
    color:#165DFF;margin-bottom:10px;font-size:18px;
}
.system-card p{color:#666;font-size:14px}
.container{max-width:1400px;margin:0 auto;padding:20px}
.header-box{
    background:#fff;border-radius:8px;padding:20px;text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    margin-bottom:20px;
}
.class-name{
    font-size:32px;color:#165DFF;letter-spacing:3px;
    margin-bottom:8px;
}
.page-desc{font-size:16px;color:#666}
.cloud-badge{
    display:inline-block;padding:4px 10px;border-radius:12px;font-size:12px;margin-top:5px;
    background:#f0f9ff;color:#0e7490;
}
.operation-panel{
    background:#fff;border-radius:8px;padding:25px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    margin-bottom:20px;
}
.section-title{
    font-size:18px;color:#165DFF;
    margin:15px 0 12px;
    border-left:4px solid #165DFF;
    padding-left:10px;
}
.row-flex{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:15px}
input,textarea{
    border:1px solid #ddd;border-radius:6px;padding:10px 12px;
    font-size:14px;
}
textarea{width:260px;height:75px;resize:none}
.short-input{width:90px}
.mid-input{width:150px}
.operator-input{width:120px}
.btn{
    padding:10px 18px;border:none;border-radius:6px;font-size:14px;
    cursor:pointer;
}
.btn-blue{background:#165DFF;color:#fff}
.btn-green{background:#00b42a;color:#fff}
.btn-red{background:#f53f3f;color:#fff}
.btn-orange{background:#ff7d00;color:#fff}
.btn-gray{background:#86909c;color:#fff}
.btn-yellow{background:#ff7d00;color:#fff}
.table-wrapper{
    background:#fff;border-radius:8px;overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    margin-bottom:20px;
}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
thead th{
    background:#165DFF;color:#fff;padding:12px;font-size:14px;
}
tbody td{padding:12px;border:1px solid #eee;font-size:14px;text-align:center;word-wrap:break-word;}
tbody tr:nth-child(even){background:#f8f9fa}
.total-score{font-weight:bold;color:#f53f3f}
.record-content{text-align:left;line-height:1.6;font-size:13px;color:#333;white-space:pre-line;}
.empty-hint{padding:40px;color:#999;font-size:15px;text-align:center}
.bottom-btn-bar{margin-top:15px;display:flex;gap:12px;justify-content:center}
.logout-btn{
    background:#86909c;color:#fff;padding:8px 15px;
    border:none;border-radius:6px;cursor:pointer;margin-bottom:12px;
}
.back-btn{
    background:#86909c;color:#fff;padding:8px 15px;
    border:none;border-radius:6px;cursor:pointer;margin-bottom:12px;margin-right:10px;
}
.rank-text{font-weight:bold;color:#ff7d00}
.tab-switch{display:flex;gap:10px;margin-bottom:15px}
.tab-active{background:#165DFF !important}
.tab-hide{display:none}
.edit-mask{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,0.5);
    display:none;align-items:center;justify-content:center;z-index:999
}
.edit-box{
    background:#fff;padding:30px;border-radius:8px;width:350px;
    box-shadow:0 4px 20px rgba(0,0,0,0.15);
}
.edit-box h3{
    margin-bottom:20px;color:#165DFF;text-align:center;
    font-size:18px;
}
.edit-row{margin-bottom:15px}
.edit-row label{display:block;margin-bottom:6px;color:#333}
.btn-group{display:flex;gap:10px;margin-top:20px}
.egg-tip{
    position:fixed;right:20px;bottom:20px;
    background:#ff7d00;color:#fff;
    padding:10px 16px;border-radius:20px;
    cursor:pointer;font-weight:bold;
}
.syncing{
    position:fixed;top:15px;right:15px;
    background:#00b42a;color:#fff;
    padding:8px 15px;border-radius:6px;
    font-weight:bold;z-index:9999;
}
</style>
</head>
<body>
<div id="login">
    <div class="login-box">
        <div class="login-title">弘极七班管理系统</div>
        <div class="login-desc">请使用班委账号登录</div>
        <div class="sync-status" id="syncStatus">☁️ 正在连接云端...</div>
        <div class="input-item">
            <label>账号</label>
            <input id="user" placeholder="请输入账号">
        </div>
        <div class="input-item">
            <label>密码</label>
            <input id="pwd" type="password" placeholder="请输入密码">
        </div>
        <button class="login-btn" onclick="login()">登录系统</button>
    </div>
</div>

<div id="system-select">
    <div class="system-select-box">
        <div class="system-title">请选择要进入的系统</div>
        <div class="system-card" onclick="selectSystem('score')">
            <h3>📊 积分系统</h3>
            <p>包含学生积分管理、礼品兑换功能</p>
        </div>
        <div class="system-card" onclick="selectSystem('assess')">
            <h3>📋 量化考核系统</h3>
            <p>积分考核管理，记录操作人，无兑换功能</p>
        </div>
    </div>
</div>

<div id="main">
    <div class="container">
        <button class="back-btn" onclick="backToSelect()">返回选择系统</button>
        <button class="logout-btn" onclick="logout()">退出登录</button>
        <div class="header-box">
            <h1 class="class-name">弘极七班</h1>
            <p class="page-desc" id="system-desc">班级积分兑换管理系统</p>
            <div class="cloud-badge" id="cloudBadge">☁️ 云端同步已开启</div>
        </div>
        <div class="operation-panel">
            <div class="section-title">一、添加班级学生</div>
            <div class="row-flex">
                <textarea id="batch" placeholder="批量录入格式&#10;每行填写：学号 姓名&#10;示例：01 李明"></textarea>
                <button class="btn btn-blue" onclick="addBatch()">批量添加学生</button>
                <input class="mid-input" id="stu" placeholder="单个录入：学号 姓名">
                <button class="btn btn-blue" onclick="addSingle()">单个添加</button>
            </div>
            <div class="section-title">二、个人加减积分</div>
            <div class="row-flex">
                <input class="mid-input" id="keyInfo" placeholder="输入学号/姓名">
                <input class="short-input" id="addScore" placeholder="加分">
                <input id="addNote" placeholder="加分原因">
                <input class="operator-input" id="addOperator" placeholder="操作人">
                <button class="btn btn-green" onclick="doAdd()">确认加分</button>
                <input class="short-input" id="minusScore" placeholder="扣分">
                <input id="minusNote" placeholder="扣分原因">
                <input class="operator-input" id="minusOperator" placeholder="操作人">
                <button class="btn btn-red" onclick="doMinus()">确认扣分</button>
            </div>
            <div class="section-title">三、全班统一加分</div>
            <div class="row-flex">
                <input id="taskName" placeholder="集体任务名称">
                <input class="short-input" id="taskPoint" placeholder="单次加分">
                <input class="operator-input" id="taskOperator" placeholder="操作人">
                <button class="btn btn-orange" onclick="doTask()">全班统一加分</button>
            </div>
            <div class="section-title" id="gift-section">四、礼品兑换扣分</div>
            <div class="row-flex" id="gift-row">
                <input class="mid-input" id="giftKey" placeholder="输入学号/姓名">
                <input id="giftName" placeholder="兑换奖品名称">
                <input class="short-input" id="giftPoint" placeholder="扣除积分">
                <button class="btn btn-green" onclick="doGift()">确认兑换</button>
            </div>
        </div>
        <div class="tab-switch">
            <button class="btn btn-blue tab-active" id="tab1" onclick="switchTable(1)">积分总表</button>
            <button class="btn btn-gray" id="tab2" onclick="switchTable(2)">积分排名榜</button>
        </div>
        <div class="table-wrapper">
            <div id="tableAll">
                <div class="section-title">📊 班级积分总表</div>
                <table id="score-table">
                    <thead>
                        <tr id="table-header">
                            <th>学号</th><th>姓名</th><th>当前总积分</th>
                            <th>加分明细</th><th>扣分明细</th><th>兑换记录</th><th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="listBody"></tbody>
                </table>
            </div>
            <div id="tableRank" class="tab-hide">
                <div class="section-title">🏆 积分榜首排名</div>
                <table>
                    <thead>
                        <tr>
                            <th>排名</th><th>学号</th><th>姓名</th><th>总积分</th>
                        </tr>
                    </thead>
                    <tbody id="rankBody"></tbody>
                </table>
            </div>
        </div>
        <div class="bottom-btn-bar">
            <button class="btn btn-green" onclick="pullFromCloud()">📥 从云端拉取数据</button>
            <button class="btn btn-blue" onclick="pushToCloud()">📤 上传数据到云端</button>
            <button class="btn btn-gray" onclick="exportData()">导出数据文本</button>
            <button class="btn btn-red" onclick="clearAllData()">一键清空全部数据</button>
        </div>
        <div class="egg-tip" onclick="showNewEgg()">🎁隐藏趣味彩蛋</div>
    </div>
</div>
<div class="edit-mask" id="editMask">
    <div class="edit-box">
        <h3>修改学生信息</h3>
        <input type="hidden" id="editIndex">
        <div class="edit-row">
            <label>学号</label>
            <input type="text" id="editNum">
        </div>
        <div class="edit-row">
            <label>姓名</label>
            <input type="text" id="editName">
        </div>
        <div class="btn-group">
            <button class="btn btn-blue" onclick="saveEdit()">保存修改</button>
            <button class="btn btn-gray" onclick="closeEdit()">取消</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/leancloud-storage@4.12.0/dist/av-min.js"></script>
<script>
const LC_CONFIG = {
    appId: "Uf6Wh0Xr6fmdQOa8DmOnS91O-gzGzoHsz",
    appKey: "vS4XQ8uV7j9zA2bK5cN8eP7w",
    serverURL: "https://uf6wh0xr.lc-cn-n1-shared.com"
};

let cloudSyncEnabled = false;
let isSyncing = false;

function initCloudSync() {
    try {
        AV.init({
            appId: LC_CONFIG.appId,
            appKey: LC_CONFIG.appKey,
            serverURL: LC_CONFIG.serverURL
        });
        cloudSyncEnabled = true;
        document.getElementById('syncStatus').className = 'sync-status sync-on';
        document.getElementById('syncStatus').textContent = '☁️ 云端同步已连接';
        document.getElementById('cloudBadge').textContent = '☁️ 云端同步已开启';
        setTimeout(forceLoadCloud, 800);
    } catch(e) {
        showSyncOffline();
    }
}

function showSyncOffline() {
    cloudSyncEnabled = false;
    document.getElementById('syncStatus').className = 'sync-status sync-off';
    document.getElementById('syncStatus').textContent = '💾 本地模式';
    document.getElementById('cloudBadge').textContent = '💾 本地存储';
}

function showSyncing() {
    const div = document.createElement('div');
    div.className = 'syncing';
    div.textContent = '☁️ 正在同步...';
    document.body.appendChild(div);
    setTimeout(() => div.remove(), 2000);
}

async function saveToCloud() {
    if(!cloudSyncEnabled || isSyncing) return;
    isSyncing = true;
    showSyncing();
    try {
        const query = new AV.Query('Hongji7Data');
        const results = await query.find();
        let cloudData;
        if(results.length > 0) {
            cloudData = results[0];
        } else {
            const Hongji7Data = AV.Object.extend('Hongji7Data');
            cloudData = new Hongji7Data();
        }
        cloudData.set('students', JSON.stringify(data));
        cloudData.set('updateTime', new Date());
        await cloudData.save();
    } catch(e) {}
    isSyncing = false;
}

async function forceLoadCloud() {
    if(!cloudSyncEnabled) return;
    try {
        const query = new AV.Query('Hongji7Data');
        query.descending('updateTime');
        query.limit(1);
        const results = await query.find();
        if(results.length > 0) {
            const cloudStudents = results[0].get('students');
            if(cloudStudents) {
                data = JSON.parse(cloudStudents);
                localStorage.setItem('hongji7_data', JSON.stringify(data));
                renderAll();
            }
        }
    } catch(e) {}
}

async function pullFromCloud() {
    if(!cloudSyncEnabled) {
        alert('云端同步未配置');
        return;
    }
    showSyncing();
    try {
        const query = new AV.Query('Hongji7Data');
        query.descending('updateTime');
        query.limit(1);
        const results = await query.find();
        if(results.length > 0) {
            const cloudStudents = results[0].get('students');
            if(cloudStudents) {
                data = JSON.parse(cloudStudents);
                localStorage.setItem('hongji7_data', JSON.stringify(data));
                renderAll();
                alert('✅ 已从云端拉取最新数据！\n\n学生数：' + data.length + ' 人');
            }
        } else {
            alert('⚠️ 云端暂无数据，请先上传数据');
        }
    } catch(e) {
        alert('❌ 拉取失败：' + e.message);
    }
}

async function pushToCloud() {
    if(!cloudSyncEnabled) {
        alert('云端同步未配置');
        return;
    }
    showSyncing();
    try {
        // 先删除所有旧数据
        const query = new AV.Query('Hongji7Data');
        query.limit(100);
        const results = await query.find();
        for(let i = 0; i < results.length; i++) {
            await results[i].destroy();
        }
        // 创建新数据
        const Hongji7Data = AV.Object.extend('Hongji7Data');
        const cloudData = new Hongji7Data();
        cloudData.set('students', JSON.stringify(data));
        cloudData.set('updateTime', new Date());
        await cloudData.save();
        alert('✅ 已上传到云端！\n\n学生数：' + data.length + ' 人\n\n其他设备点击「从云端拉取数据」即可同步');
    } catch(e) {
        alert('❌ 上传失败：' + e.message);
    }
}

const ADMIN_USER = "弘极班委";
const ADMIN_PWD = "123456";
const CLEAR_PWD = "123456";
let currentSystem = 'score';
let data = JSON.parse(localStorage.getItem('hongji7_data')) || [];
let addCount = 0;
let nowTab = 1;

const novelEgg = ["七班潜力少年超多✨","积分见证每日成长😎","班风向上人人闪光🌟","团结共进未来可期"];
const kingEgg = ["🏆积分王者，实力出众","稳居榜首优秀已成习惯"];
const funTalk = ["加分到手快乐翻倍🥳","集体发力共同进步","付出皆有回报"];

function getRandomText(arr){return arr[Math.floor(Math.random()*arr.length)];}

function showNewEgg(){
    alert(`🔍隐藏彩蛋\n${getRandomText(novelEgg)}`);
}

function switchTable(num){
    nowTab = num;
    let t1 = document.getElementById('tableAll');
    let t2 = document.getElementById('tableRank');
    let b1 = document.getElementById('tab1');
    let b2 = document.getElementById('tab2');
    if(num===1){
        t1.classList.remove('tab-hide');
        t2.classList.add('tab-hide');
        b1.classList.add('tab-active');
        b2.classList.remove('tab-active');
    }else{
        t1.classList.add('tab-hide');
        t2.classList.remove('tab-hide');
        b2.classList.add('tab-active');
        b1.classList.remove('tab-active');
    }
}

function login(){
    let u = document.getElementById('user').value.trim();
    let p = document.getElementById('pwd').value.trim();
    if(u === ADMIN_USER && p === ADMIN_PWD){
        localStorage.setItem('isLogin','true');
        forceLoadCloud();
        showSystemSelect();
    }else{
        alert("账号密码不对哦~");
    }
}

function showSystemSelect(){
    document.getElementById('login').style.display = 'none';
    document.getElementById('system-select').style.display = 'flex';
    document.getElementById('main').style.display = 'none';
}

function selectSystem(system){
    currentSystem = system;
    document.getElementById('system-select').style.display = 'none';
    showMain();
}

function backToSelect(){
    showSystemSelect();
}

function logout(){
    localStorage.removeItem('isLogin');
    alert("👋本次管理结束");
    location.reload();
}

function showMain(){
    document.getElementById('main').style.display = 'block';
    if(currentSystem === 'score'){
        document.getElementById('system-desc').textContent = '班级积分兑换管理系统';
        document.getElementById('gift-section').style.display = 'block';
        document.getElementById('gift-row').style.display = 'flex';
        document.getElementById('table-header').innerHTML = `
            <th>学号</th><th>姓名</th><th>当前总积分</th>
            <th>加分明细</th><th>扣分明细</th><th>兑换记录</th><th>操作</th>
        `;
    }else{
        document.getElementById('system-desc').textContent = '班级量化考核管理系统';
        document.getElementById('gift-section').style.display = 'none';
        document.getElementById('gift-row').style.display = 'none';
        document.getElementById('table-header').innerHTML = `
            <th>学号</th><th>姓名</th><th>当前总积分</th>
            <th>加分明细</th><th>扣分明细</th><th>操作</th>
        `;
    }
    renderAll();
    alert(`🚀成功登入${currentSystem==='score'?'积分':'量化考核'}管理系统`);
}

window.onload = function(){
    initCloudSync();
    if(localStorage.getItem('isLogin')==='true'){
        showSystemSelect();
    }
}

function renderAll(){renderTable();renderRank();}

function renderTable(){
    let tb = document.getElementById('listBody');
    let html = '';
    let colCount = currentSystem === 'score' ? 7 : 6;
    if(data.length===0){
        html=`<tr><td colspan="${colCount}" class="empty-hint">暂无学生</td></tr>`;
    }else{
        data.sort((a,b)=>a.num.localeCompare(b.num));
        data.forEach((item,i)=>{
            if(currentSystem === 'score'){
                html+=`<tr>
                <td>${item.num}</td>
                <td>${item.name}</td>
                <td class="total-score">${item.score}</td>
                <td class="record-content">${item.add||'无'}</td>
                <td class="record-content">${item.min||'无'}</td>
                <td class="record-content">${item.gift||'无'}</td>
                <td>
                    <button class="btn btn-yellow" onclick="openEdit(${i})">编辑</button>
                    <button class="btn btn-red" onclick="delStudent(${i})">删除</button>
                </td></tr>`;
            }else{
                html+=`<tr>
                <td>${item.num}</td>
                <td>${item.name}</td>
                <td class="total-score">${item.score}</td>
                <td class="record-content">${item.add||'无'}</td>
                <td class="record-content">${item.min||'无'}</td>
                <td>
                    <button class="btn btn-yellow" onclick="openEdit(${i})">编辑</button>
                    <button class="btn btn-red" onclick="delStudent(${i})">删除</button>
                </td></tr>`;
            }
        });
    }
    tb.innerHTML=html;
}

function renderRank(){
    let tb = document.getElementById('rankBody');
    let html='';
    if(data.length===0){
        html='<tr><td colspan="4" class="empty-hint">暂无数据</td></tr>';
    }else{
        let arr=[...data].sort((x,y)=>y.score-x.score);
        arr.forEach((item,idx)=>{
            html+=`<tr><td class="rank-text">第${idx+1}名</td><td>${item.num}</td><td>${item.name}</td><td class="total-score">${item.score}</td></tr>`;
        });
    }
    tb.innerHTML=html;
}

function openEdit(idx){
    let stu = data[idx];
    document.getElementById('editIndex').value = idx;
    document.getElementById('editNum').value = stu.num;
    document.getElementById('editName').value = stu.name;
    document.getElementById('editMask').style.display = 'flex';
}

function closeEdit(){
    document.getElementById('editMask').style.display = 'none';
}

function saveEdit(){
    let idx = parseInt(document.getElementById('editIndex').value);
    let newNum = document.getElementById('editNum').value.trim();
    let newName = document.getElementById('editName').value.trim();
    if(!newNum || !newName){
        alert("学号和姓名不能为空");
        return;
    }
    let repeat = data.some((item,i)=> item.num === newNum && i !== idx);
    if(repeat){
        alert("该学号已存在，无法修改");
        return;
    }
    data[idx].num = newNum;
    data[idx].name = newName;
    closeEdit();
    save();
    alert("学生信息修改成功");
}

function findStudent(key){return data.find(s=>s.num===key||s.name===key);}

function save(){
    localStorage.setItem('hongji7_data', JSON.stringify(data));
    renderAll();
    saveToCloud();
}

function addBatch(){
    let t=document.getElementById('batch').value.trim();
    if(!t)return alert("请填写学生名单");
    let lines=t.split('\n').map(i=>i.trim()).filter(i=>i);
    let cnt=0;
    lines.forEach(line=>{
        let sp=line.split(/\s+/);
        if(sp.length<2)return;
        let num=sp[0],name=sp.slice(1).join(' ');
        if(!data.some(x=>x.num===num)){
            data.push({num,name,score:0,add:'',min:'',gift:''});
            cnt++;
        }
    });
    document.getElementById('batch').value='';
    save();
    alert(`🎉成功添加${cnt}名同学`);
}

function addSingle(){
    let t=document.getElementById('stu').value.trim();
    if(!t)return alert("格式：学号 姓名");
    let sp=t.split(/\s+/);
    if(sp.length<2)return alert("格式错误");
    let num=sp[0],name=sp.slice(1).join(' ');
    if(data.some(x=>x.num===num))return alert("学号已存在");
    data.push({num,name,score:0,add:'',min:'',gift:''});
    document.getElementById('stu').value='';
    save();
    alert(`✅${name}录入成功`);
}

function doAdd(){
    let key=document.getElementById('keyInfo').value.trim();
    let s=parseInt(document.getElementById('addScore').value);
    let note=document.getElementById('addNote').value.trim();
    let operator=document.getElementById('addOperator').value.trim();
    if(!key||isNaN(s)||s<=0||!note)return alert("请补全信息");
    if(currentSystem==='assess' && !operator)return alert("量化考核系统请填写操作人");
    let stu=findStudent(key);
    if(!stu)return alert("未找到该学生");
    
    stu.score+=s;
    let time=new Date().toLocaleString().slice(5);
    let operatorStr = operator ? ` 操作人:${operator}` : '';
    stu.add+=(stu.add?'\n':'')+`[${time}]+${s}分 ${note}${operatorStr}`;
    
    document.getElementById('keyInfo').value='';
    document.getElementById('addScore').value='';
    document.getElementById('addNote').value='';
    document.getElementById('addOperator').value='';
    save();
    alert(getRandomText(funTalk));
}

function doMinus(){
    let key=document.getElementById('keyInfo').value.trim();
    let s=parseInt(document.getElementById('minusScore').value);
    let note=document.getElementById('minusNote').value.trim();
    let operator=document.getElementById('minusOperator').value.trim();
    if(!key||isNaN(s)||s<=0||!note)return alert("补全扣分信息");
    if(currentSystem==='assess' && !operator)return alert("量化考核系统请填写操作人");
    let stu=findStudent(key);
    if(!stu)return alert("未找到学生");
    
    stu.score=Math.max(0,stu.score-s);
    let time=new Date().toLocaleString().slice(5);
    let operatorStr = operator ? ` 操作人:${operator}` : '';
    stu.min+=(stu.min?'\n':'')+`[${time}]-${s}分 ${note}${operatorStr}`;
    
    document.getElementById('keyInfo').value='';
    document.getElementById('minusScore').value='';
    document.getElementById('minusNote').value='';
    document.getElementById('minusOperator').value='';
    save();
    alert(getRandomText(funTalk));
}

function doTask(){
    let task=document.getElementById('taskName').value.trim();
    let s=parseInt(document.getElementById('taskPoint').value);
    let operator=document.getElementById('taskOperator').value.trim();
    if(!task||isNaN(s)||s<=0)return alert("填写任务与分值");
    if(currentSystem==='assess' && !operator)return alert("量化考核系统请填写操作人");
    let time=new Date().toLocaleString().slice(5);
    let operatorStr = operator ? ` 操作人:${operator}` : '';
    
    data.forEach(stu=>{
        stu.score+=s;
        stu.add+=(stu.add?'\n':'')+`[${time}]+${s}分 ${task}${operatorStr}`;
    });
    
    document.getElementById('taskName').value='';
    document.getElementById('taskPoint').value='';
    document.getElementById('taskOperator').value='';
    save();
    alert("🤝全员加分完成");
}

function doGift(){
    if(currentSystem!=='score')return;
    let key=document.getElementById('giftKey').value.trim();
    let s=parseInt(document.getElementById('giftPoint').value);
    let gift=document.getElementById('giftName').value.trim();
    if(!key||isNaN(s)||s<=0||!gift)return alert("完善兑换信息");
    let stu=findStudent(key);
    if(!stu)return alert("未找到学生");
    if(stu.score<s)return alert("积分不足");
    
    stu.score-=s;
    let time=new Date().toLocaleString().slice(5);
    stu.gift+=(stu.gift?'\n':'')+`[${time}]-${s}分 兑换${gift}`;
    
    document.getElementById('giftKey').value='';
    document.getElementById('giftName').value='';
    document.getElementById('giftPoint').value='';
    save();
    alert(getRandomText(funTalk));
}

function delStudent(i){
    if(!confirm("确定删除该学生记录？"))return;
    data.splice(i,1);
    save();
    alert("已删除记录");
}

function exportData(){
    if(data.length===0)return alert("暂无数据导出");
    let systemName = currentSystem==='score'?'积分':'量化考核';
    let txt=`弘极七班${systemName}记录表\n学号\t姓名\t积分\t加分记录\t扣分记录${currentSystem==='score'?'\t兑换记录':''}\n`;
    data.forEach(item=>{
        let addStr = (item.add||'无').replace(/\n/g,' ');
        let minStr = (item.min||'无').replace(/\n/g,' ');
        let giftStr = currentSystem==='score' ? `\t${(item.gift||'无').replace(/\n/g,' ')}` : '';
        txt+=`${item.num}\t${item.name}\t${item.score}\t${addStr}\t${minStr}${giftStr}\n`;
    });
    let blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`弘极七班${systemName}记录.txt`;
    a.click();
    alert("💾数据下载成功");
}

function clearAllData(){
    let input=prompt("输入清空密码：");
    if(input!==CLEAR_PWD)return alert("密码错误");
    if(!confirm("确认清空所有数据？不可恢复！"))return;
    data=[];
    save();
    alert("♻️数据已重置");
}
</script>
